weight_file: "dr_spaam_5_on_frog.pth" # name of the weight file
detector_model: "DR-SPAAM"            # Set model name: DROW3 or DR-SPAAM
use_gpu: True                         # Set to True to use GPU
stride: 1                             # Downsample scans for faster inference
panoramic_scan: False                 # Set to True if the scan covers 360 degree
use_box: False                        # Set to True to use bounding box
tracking: True                        # Set to True to enable tracking
dets_thresh: 0.5                      # Set confidence threshold for detection
track_thresh: 0.5                     # Set confidence threshold for tracking
detect_mode: True                     # Set to True to enable detection
